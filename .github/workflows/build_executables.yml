name: Build Standalone Executables

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-binaries:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: BarcoID-Windows-x64
            binary_path: dist/BarcoID-Windows-x64.exe
          - os: macos-latest
            artifact_name: BarcoID-macOS
            binary_path: dist/BarcoID-macOS
          - os: ubuntu-latest
            artifact_name: BarcoID-Linux-x64
            binary_path: dist/BarcoID-Linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Linux Tkinter)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build single-file executable
        run: |
          python build_executable.py --name ${{ matrix.artifact_name }}

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}

  release:
    name: Publish GitHub Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Attach executables to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
          body: |
            ### Standalone Zero-Installation Binaries
            Download and run the binary for your platform without installing Python:
            - **Windows (x64):** `BarcoID-Windows-x64.exe`
            - **macOS:** `BarcoID-macOS`
            - **Linux (x64):** `BarcoID-Linux-x64`

            #### Windows SmartScreen Notice ("Windows protected your PC")
            Because BarcoID is a newly released open-source scientific tool without a commercial EV certificate, Windows Defender SmartScreen may display an unrecognized app notice:
            1. Click **"More info"** (*Další informace*).
            2. Click **"Run anyway"** (*Přesto spustit*).
            *(Alternatively, right-click `BarcoID-Windows-x64.exe` > Properties > check "Unblock" > OK).*

